version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # 公開から 7 日たっていない版は PR にしない（侵害版の多くは数日で取り下げられるため）。
    # セキュリティ更新にはこの待ちはかからない
    cooldown:
      default-days: 7
    groups:
      # パッチ・マイナー更新は1つのPRにまとめてレビュー負荷を下げる
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

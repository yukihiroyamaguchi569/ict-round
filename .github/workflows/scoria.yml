name: scoria

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Installed dependencies let scoria run tsc, knip and the cycle check.
      - run: npm ci
      # scoria only reads an existing coverage report; it never runs the tests itself.
      - run: npm run test:coverage
      # Report only (mode: report in scoria.config.json); the job summary shows the change since .scoria/baseline.json.
      - run: npx -y scoria@0.3.0 --sarif scoria.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: scoria.sarif
          category: scoria
